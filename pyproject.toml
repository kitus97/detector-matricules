[project]
name = "detector-matricules"
version = "0.1.0"
description = "ALPR system: classical computer vision for plate detection and character segmentation, plus a CNN trained from scratch for character recognition."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "scikit-learn>=1.8.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]
